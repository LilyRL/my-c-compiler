[package]
name = "my-c-compiler"
version = "0.1.0"
edition = "2024"


[dependencies]
ariadne = { version = "0.6.0", features = ["auto-color"] }
clap = { version = "4.6.4", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
ordered-float = "5.5.0"
phf = { version = "0.14.0", features = ["macros"] }
rand = "0.10.2"
sge_global = "1.1.0"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
